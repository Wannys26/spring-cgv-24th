spring:
  datasource:
    # Connection and temporary credentials are provided only by the test container.
    embedded-database-connection: none
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: create-drop

cgv:
  jwt:
    secret-base64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    access-token-seconds: 1800
  payment:
    recovery:
      scheduler:
        # 테스트가 의도적으로 남긴 미완료 작업을 백그라운드 복구가 바꾸지 않도록 끈다.
        enabled: false
